name: Release Desktop

# Runs on the same version tags as the web release workflow. The existing
# release.yml creates the GitHub Release + changelog; this workflow builds the
# desktop apps for all three OSes and uploads them to that release, then bumps
# the Homebrew Cask. Unsigned by design (CSC_IDENTITY_AUTO_DISCOVERY=false).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--mac --arm64 --x64"
          - os: windows-latest
            args: "--win"
          - os: ubuntu-latest
            args: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build & publish desktop app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish always

  bump-cask:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Homebrew Cask to released version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="claude-code-studio-${VERSION}-arm64.dmg"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DMG}"
          echo "Fetching $URL"
          curl -fL "$URL" -o "$DMG"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          CASK="homebrew-tap/Casks/claude-code-studio.rb"
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"
          sed -i -E "s/^  sha256 .*/  sha256 \"${SHA}\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git commit -m "chore: bump Homebrew cask to ${VERSION}" || echo "cask unchanged"
          git push
