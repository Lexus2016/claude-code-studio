name: Release Desktop

# Runs on the same version tags as the web release workflow. release.yml creates
# the GitHub Release + changelog; this workflow builds the Windows and Linux apps
# and uploads them to that release. Both stay unsigned
# (CSC_IDENTITY_AUTO_DISCOVERY=false).
#
# macOS is NOT built here. It is signed with the Developer ID certificate and
# notarized with a notarytool keychain profile, and both live only in the release
# Mac's keychain — `npm run release:mac` builds, verifies and uploads it from there
# (scripts/release-mac.js, docs/electron-desktop/MAC-SIGNING.md). A runner has
# neither, and an unsigned mac build would break every installed copy: the app
# updates itself through Squirrel.Mac, which refuses an update not signed by the
# same Developer ID.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--win"
          - os: ubuntu-latest
            args: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build & publish desktop app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish always
