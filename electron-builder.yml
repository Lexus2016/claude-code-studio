appId: studio.claudecode.app
productName: Claude Code Studio
copyright: © Claude Code Studio

# GitHub releases are the update feed for electron-updater (Win/Linux) and the
# source of the dmg for the Homebrew Cask (macOS).
publish:
  provider: github
  owner: Lexus2016
  repo: claude-code-studio
  releaseType: release   # publish directly (not a draft) so it merges cleanly with release.yml

asar: true
# Runtime uses Node's built-in node:sqlite (Electron's Node >= 22.13), not the
# native better-sqlite3, and ssh2 falls back to pure-JS without cpu-features —
# so skip rebuilding native modules against Electron's ABI (avoids a brittle,
# slow compile step that isn't needed).
npmRebuild: false

# Spawned helper scripts and hooks must be real files on disk so the child
# Node interpreter can read them — they cannot live inside the asar archive.
asarUnpack:
  - "mcp-*.js"
  - "hooks/**"
  # Whatever those scripts require() has to be out here with them. The child is a
  # plain `node` with no asar support, so a module left inside the archive fails one
  # level deeper than the entry point: mcp-bots.js unpacked fine and still died on
  # `Cannot find module './bots.js'`. Pinned by test/asar-helpers.test.js.
  - "bots.js"

files:
  - "**/*"
  - "!.planning/**"
  - "!docs/**"
  - "!data/**"
  - "!workspace/**"
  - "!.git/**"
  - "!.github/**"
  - "!.claude/**"
  - "!.serena/**"
  - "!.playwright-mcp/**"
  - "!**/*.bak"
  - "!dist-desktop/**"
  - "!public/screenshots/**"
  - "!homebrew-tap/**"
  - "!README*"
  - "!CLAUDE.md"
  # SECURITY: never ship developer secrets or repo test/junk into the app bundle.
  # The desktop app reads config.json/.env from userData (APP_DIR), NOT the bundle
  # (electron/main.js:128), and loadConfig() tolerates a missing file (server.js:1864),
  # so excluding these is safe. Verified via `asar list` that they were leaking.
  - "!.env*"
  - "!config.json"
  - "!tasks/**"
  - "!test-snapshot*"
  - "!test-*.sh"

directories:
  output: dist-desktop
  buildResources: build

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  artifactName: "claude-code-studio-${version}-${arch}.${ext}"

win:
  target: [nsis]
  artifactName: "claude-code-studio-Setup-${version}.${ext}"

linux:
  target: [AppImage, deb]
  category: Development
  artifactName: "claude-code-studio-${version}-${arch}.${ext}"
